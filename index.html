<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    h1 { margin-bottom: 12px; font-size: 1.6rem; letter-spacing: 2px; }
    #info {
      display: flex;
      gap: 32px;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    canvas {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 4px;
      display: block;
    }
    #message {
      margin-top: 14px;
      font-size: 1.1rem;
      min-height: 1.5em;
      letter-spacing: 1px;
    }
    #restart {
      margin-top: 10px;
      padding: 8px 24px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      display: none;
    }
    #restart:hover { background: #c73652; }
  </style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="info">
    <span>スコア: <strong id="score">0</strong></span>
    <span>残機: <strong id="lives">3</strong></span>
  </div>
  <canvas id="canvas" width="480" height="400"></canvas>
  <div id="message">← → キーまたはマウスでパドルを操作</div>
  <button id="restart" onclick="startGame()">もう一度</button>
  <script src="main.js"></script>
</body>
</html>
